<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://open.er-api.com https://api.frankfurter.app; frame-src 'self' https://script.google.com https://docs.google.com; worker-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agreement Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="style.css?v=20260810-contract-dashboard-v28" />
</head>
<body class="bg-gray-100 h-screen overflow-hidden">
  <div class="flex flex-col h-full bg-white p-4 shadow-md">
    <div id="moduleHeader" class="relative z-[999] agreement-header-layout">
      <div class="hidden sm:block">
        <p class="font-semibold">Procurement Division</p>
        <p class="text-xs text-gray-400">PT Makmur Sejahtera Wisesa</p>
        <p id="moduleSubtitle" class="text-xs text-gray-400">Contract - Agreement Tracker</p>
      </div>
      <h1 id="buyerCenteredTitle" class="text-lg sm:text-xl font-bold tracking-tight agreement-page-title">Agreement Tracker</h1>
      <div class="agreement-header-actions flex flex-col md:flex-row gap-2 w-full">
        <div class="relative w-full md:w-72">
          <input id="searchInput" type="search" autocomplete="off" placeholder="Search Work Order, vendor, buyer, status..." class="border border-gray-300 rounded-lg pl-3 pr-10 py-2 h-[40px] w-full" />
          <button id="clearSearchBtn" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700 hidden">✕</button>
        </div>
        <div id="actionDropdown" class="action-dropdown">
          <button id="menuBtn" type="button" class="action-btn" aria-haspopup="true" aria-expanded="false">Action ▼</button>
          <div id="menu" class="action-menu" role="menu" aria-hidden="true">
            <button type="button" role="menuitem" id="addAgreementBtn">Add</button>
            <button type="button" role="menuitem" id="exportAgreementBtn">Export Excel</button>
            <label class="action-menu-item" role="menuitem">
              Import Excel
              <input type="file" id="importAgreementFile" accept=".xlsx,.xls" class="hidden" />
            </label>
            <hr>
            <button type="button" role="menuitem" class="danger" id="clearAgreementBtn">All Clear</button>
          </div>
        </div>
      </div>
    </div>

    <div id="tableContainer" class="table-container flex-1" tabindex="0">
      <table id="agreementTable" class="text-xs sm:text-sm text-gray-700 border border-gray-300 rounded-lg">
        <thead class="bg-slate-700 text-white uppercase text-xs"><tr id="theadRow"></tr></thead>
        <tbody id="tableBody" class="divide-y divide-gray-200"></tbody>
      </table>
    </div>
    <div class="flex items-center justify-between gap-3 mt-2 text-xs text-gray-500">
      <div id="tableInfo">Showing 0 of 0 data</div>
      <div class="flex items-center gap-2">
        <button id="prevPage" type="button" class="pagination-btn">Previous</button>
        <span id="pageInfo">1 / 1</span>
        <button id="nextPage" type="button" class="pagination-btn">Next</button>
      </div>
      <div id="syncInfo" class="text-right">Last Sync: -</div>
    </div>
  </div>

  <div id="formModal" class="fixed inset-0 bg-black/60 hidden z-[9999]">
    <div id="formWindow" class="procurement-form-window workspace-normal">
      <div id="formDragHandle" class="procurement-form-drag-handle" title="Tahan dan geser untuk memindahkan form">
        <span id="formWindowTitle">Agreement Tracker Form</span>
        <button id="closeModal" type="button" aria-label="Tutup form">✕</button>
      </div>
      <iframe id="formFrame" title="Agreement Tracker Form"></iframe>
    </div>
  </div>

  <div id="rowContextMenu" class="row-context-menu hidden" role="menu" aria-hidden="true">
    <button id="contextDeleteBtn" type="button" role="menuitem" class="danger"><i data-lucide="trash-2"></i><span>Delete Row</span></button>
  </div>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="../config.js?v=20260810-contract-dashboard-v28"></script>
  <script src="../shared-modules.js?v=20260810-contract-dashboard-v28"></script>
  <script src="../common.js?v=20260810-contract-dashboard-v28"></script>
  <script src="script.js?v=20260813-page20-v130"></script>
</body>
</html>
