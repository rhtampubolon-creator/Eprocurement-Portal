<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://open.er-api.com https://api.frankfurter.app; frame-src 'self' https://script.google.com https://docs.google.com; worker-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CONTRACT MANAGEMENT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css?v=20260810-contract-dashboard-v28">
</head>

<body class="bg-gray-100 h-screen overflow-hidden">
  <div class="flex flex-col h-full bg-white p-4 shadow-md">

      <!-- Header: Home • Title • Search (kiri) + Action (kanan) -->
      <div id="moduleHeader" class="flex flex-col md:grid md:grid-cols-[auto,1fr,auto] items-center gap-3 mb-3">
        
        <!-- Home -->
        <div class="flex items-center">
          <div>
            <p class="font-semibold">Procurement Division</p>
            <p class="text-xs text-gray-400">PT Makmur Sejahtera Wisesa</p>
            <p id="moduleSubtitle" class="text-xs text-gray-400">Contract Management</p>
          </div>
        </div>

        <!-- Tengah: Title -->
        <h1 id="buyerCenteredTitle" class="text-lg sm:text-xl font-bold tracking-tight"></h1>

        
        <!-- 🔍 Search kiri dan ⚙️ Action kanan -->
        <div class="flex items-center justify-between gap-2 w-full">

          <!-- Search -->
          <input id="searchInput" onkeyup="filterTable()" placeholder="Search..." class="border border-gray-300 rounded-lg px-3 py-2 h-[40px] w-40 sm:w-56 md:w-64" />
          
          <!-- Action -->
          <div id="actionDropdown" class="action-dropdown">
            <button id="menuBtn" type="button" class="action-btn" aria-haspopup="true" aria-expanded="false">
              Action ▼
            </button>
            <div id="menu" class="action-menu" role="menu" aria-hidden="true">
              <button type="button" role="menuitem" onclick="handleAdd()">Add</button>
              <button type="button" role="menuitem" onclick="exportExcel()">Export Excel</button>
              <label class="action-menu-item" role="menuitem">
                Import Excel
                <input type="file" id="excelFile" accept=".xlsx,.xls" class="hidden" onchange="importExcel(event)" />
              </label>
              <hr>
              <button type="button" role="menuitem" class="danger" onclick="clearAll()">All Clear</button>
            </div>
          </div>
      </div>
  </div>
  
  <!-- Tabel -->
  <div id="tableContainer" class="flex-1 overflow-auto scroll-container" tabindex="0">
      <table class="contract-table w-full text-xs sm:text-sm text-gray-700 border border-gray-300 rounded-lg">
        <thead class="bg-gray-200 text-gray-800 uppercase text-xs">
          <tr id="theadRow"></tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-gray-200"></tbody>
      </table>
    </div>
  </div>


  <div id="rowContextMenu" class="row-context-menu hidden" role="menu" aria-hidden="true">
    <button id="contextDeleteBtn" type="button" role="menuitem" class="danger">🗑 <span>Delete Row</span></button>
  </div>
  <div id="toastContainer"></div>

    <script src="../config.js?v=20260810-contract-dashboard-v28"></script>
<script src="../shared-modules.js?v=20260810-contract-dashboard-v28"></script>
<script src="../common.js?v=20260810-contract-dashboard-v28"></script>
    <script src="script.js?v=20260810-contract-dashboard-v28"></script>

</body>
</html>
