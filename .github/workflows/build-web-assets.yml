name: Build Web Performance Assets

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'tailwind.config.js'
      - 'assets/tailwind-input.css'
      - 'tools/apply-performance-assets.mjs'
      - '.github/workflows/build-web-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build local production assets
        run: npm run build:assets

      - name: Apply local assets and performance cache to HTML
        run: node tools/apply-performance-assets.mjs

      - name: Commit generated performance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tailwind.min.css assets/lucide.min.js assets/xlsx.full.min.js package-lock.json '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No generated performance changes."
            exit 0
          fi
          git commit -m "Apply local web assets and cache-first startup"
          git push
