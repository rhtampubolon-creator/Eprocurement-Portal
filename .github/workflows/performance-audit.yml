name: Performance Audit Guardrails

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.gs'
      - 'package.json'
      - '.github/workflows/performance-audit.yml'
  push:
    branches: [main, 'perf/**']
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.gs'
      - 'package.json'
      - '.github/workflows/performance-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Static performance and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run performance audit
        run: npm run audit:performance
